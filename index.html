<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>连接设备 - iPhone 16 原型</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --design-width: 440;
      --design-height: 956;
      --scale: 1;
      color: #333;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
    }

    .phone {
      position: relative;
      width: min(100vw, calc(100dvh * 440 / 956), 440px);
      aspect-ratio: 440 / 956;
      overflow: hidden;
      background: #f5f3f1;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 440px;
      height: 956px;
      overflow: hidden;
      transform: scale(var(--scale));
      transform-origin: top left;
      background: #f5f3f1;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 440px;
      height: 54px;
      z-index: 5;
    }

    .time {
      position: absolute;
      top: 13.65px;
      left: 22.51px;
      width: 57.89px;
      height: 30.02px;
      display: grid;
      place-items: center;
      color: #000;
      font-size: 15.01px;
      font-weight: 600;
      line-height: 1;
      text-align: center;
    }

    .cell {
      position: absolute;
      top: 22.94px;
      left: 360.81px;
      width: 18.22px;
      height: 11.44px;
    }

    .wifi {
      position: absolute;
      top: 22.58px;
      left: 384.42px;
      width: 16.37px;
      height: 11.76px;
    }

    .battery {
      position: absolute;
      top: 22.23px;
      left: 406.19px;
      width: 26.8px;
      height: 12.86px;
    }

    .battery-body {
      position: absolute;
      top: 0.35px;
      left: 0;
      width: 23.58px;
      height: 12.15px;
      border: 1.07px solid rgb(0 0 0 / 40%);
      border-radius: 2.86px;
    }

    .battery-power {
      position: absolute;
      top: 2.5px;
      left: 2.14px;
      width: 19.3px;
      height: 7.86px;
      border-radius: 1.43px;
      background: #000;
    }

    .battery-head {
      position: absolute;
      top: 4.29px;
      right: 0;
      width: 2.14px;
      height: 4.28px;
    }

    .hero-bg {
      position: absolute;
      top: 171.77px;
      left: 0;
      width: 440px;
      height: 153.23px;
    }

    .device-shell {
      position: absolute;
      top: 86.65px;
      left: 17.59px;
      width: 147.71px;
      height: 228px;
      overflow: hidden;
    }

    .device-shell img {
      position: absolute;
      top: 0;
      left: -168.9px;
      width: 332.83px;
      height: 228px;
      max-width: none;
    }

    .device-cover {
      position: absolute;
      top: 94.95px;
      left: 43.64px;
      width: 140.24px;
      height: 186.99px;
      overflow: hidden;
      -webkit-mask-image: url("assets/figma-iphone16-connect/mask.svg");
      mask-image: url("assets/figma-iphone16-connect/mask.svg");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100.41px 170.94px;
      mask-size: 100.41px 170.94px;
      -webkit-mask-position: 18.26px 15.77px;
      mask-position: 18.26px 15.77px;
    }

    .device-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .device-copy {
      position: absolute;
      top: 100px;
      left: 184px;
      width: 194px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .device-name {
      margin: 0;
      color: #333;
      font-size: 28px;
      font-weight: 500;
      line-height: normal;
      letter-spacing: 0.2px;
    }

    .device-model {
      margin: 0;
      color: #666;
      font-size: 17px;
      font-weight: 500;
      line-height: normal;
    }

    .connection-state {
      position: absolute;
      top: 265px;
      left: 184px;
      height: 36px;
      border: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px 10px 13px;
      border-radius: 18px;
      background: rgb(153 153 153 / 20%);
      font: inherit;
    }

    .connection-state.is-selected {
      background: #edd6cd;
      box-shadow: 0 0 0 1px rgb(210 139 121 / 18%) inset;
    }

    .connection-dot {
      width: 6px;
      height: 6px;
      display: block;
    }

    .connection-text {
      color: #999;
      font-size: 15px;
      font-weight: 500;
      line-height: 16px;
      white-space: nowrap;
    }

    .device-switch {
      position: absolute;
      top: 107.5px;
      left: 390px;
      width: 26px;
      height: 26px;
      border: 0;
      padding: 0;
      background: transparent;
    }

    .action-list {
      position: absolute;
      top: 340px;
      left: 16px;
      width: 408px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-card {
      width: 408px;
      height: 80px;
      border: 0;
      border-radius: 18px;
      padding: 20px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      color: #333;
      font: inherit;
      text-align: left;
    }

    .action-label {
      font-size: 17px;
      font-weight: 500;
      line-height: normal;
      white-space: nowrap;
    }

    .action-icon {
      width: 40px;
      height: 40px;
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .action-icon img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .link-frame {
      position: absolute;
      inset: 4.5px;
      border: 3px solid #333;
      border-radius: 6.2px;
    }

    .link-frame img {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 21px;
      height: 21px;
    }

    .font-main {
      position: absolute;
      top: 3.73px;
      left: 4.8px;
      width: 30px;
      height: 31.11px;
    }

    .font-plus {
      position: absolute;
      top: 24.8px;
      left: 24.8px;
      width: 9px;
      height: 10px;
    }

    .tabbar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 440px;
      height: 84px;
      padding: 7px 31px 8px;
      background: #f5f3f1;
    }

    .tab-items {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 62px;
      height: 43px;
    }

    .tab {
      width: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #333;
      font-size: 10px;
      font-weight: 500;
      line-height: normal;
      text-align: center;
      white-space: nowrap;
    }

    .tab-icon {
      position: relative;
      width: 26px;
      height: 26px;
    }

    .tab-icon img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .tab-store img,
    .tab-apps img {
      position: absolute;
      width: auto;
      height: auto;
    }

    .tab-store img {
      top: 2.01px;
      left: 0.69px;
      width: 25px;
      height: 21.31px;
    }

    .tab-apps img {
      top: 0.94px;
      left: 0.5px;
      width: 25px;
      height: 24.13px;
    }

    .settings-poly {
      position: absolute;
      top: 0.58px;
      left: 1.67px;
      width: 21.65px;
      height: 23.84px;
    }

    .settings-dot {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 10px;
      height: 10px;
    }

    .home-indicator {
      position: absolute;
      left: 153px;
      bottom: 10.5px;
      width: 134px;
      height: 5px;
    }

    .connect-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
    }

    .connect-layer.is-open {
      display: block;
    }

    .scrim {
      position: absolute;
      inset: 0;
      border: 0;
      padding: 0;
      background: rgb(0 0 0 / 70%);
    }

    .connect-sheet {
      position: absolute;
      top: 422px;
      left: 0;
      width: 440px;
      height: 534px;
      border-radius: 24px 24px 0 0;
      background: #f5f3f1;
      transition: border-radius 360ms ease;
    }

    .connect-layer.is-success .connect-sheet {
      border-radius: 40px 40px 0 0;
    }

    .sheet-close {
      position: absolute;
      top: 16px;
      left: 398px;
      width: 26px;
      height: 26px;
      border: 0;
      padding: 0;
      background: transparent;
    }

    .sheet-close img {
      display: block;
      width: 26px;
      height: 26px;
    }

    .sheet-title {
      position: absolute;
      top: 463px;
      left: 130px;
      width: 180px;
      margin: 0;
      color: #333;
      font-size: 22px;
      font-weight: 500;
      line-height: normal;
      text-align: center;
    }

    .sheet-card {
      position: absolute;
      top: 526px;
      left: 17px;
      width: 408px;
      height: 76px;
      border-radius: 18px;
      background: #fff;
      overflow: hidden;
    }

    .sheet-step {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 13px 65px 13px 18px;
      opacity: 0;
      transform: translateX(440px);
      transition: transform 960ms cubic-bezier(.2, .8, .2, 1), opacity 720ms ease;
    }

    .sheet-step.is-active {
      opacity: 1;
      transform: translateX(0);
    }

    .sheet-step.is-exiting {
      opacity: 0;
      transform: translateX(-300px);
    }

    .sheet-card-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 325px;
      height: 26px;
    }

    .alert-mark {
      position: relative;
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
    }

    .alert-mark img {
      display: block;
      width: 26px;
      height: 26px;
    }

    .alert-mark span {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      color: #999;
      font-size: 16px;
      font-weight: 500;
      line-height: normal;
      text-align: center;
      white-space: nowrap;
    }

    .sheet-card-text {
      color: #333;
      font-size: 17px;
      font-weight: 500;
      line-height: normal;
      white-space: nowrap;
    }

    .sheet-status-icon {
      position: absolute;
      top: 23px;
      right: 18px;
      width: 30px;
      height: 30px;
    }

    .sheet-status-icon.is-hidden {
      display: none;
    }

    .loading-ring {
      border: 4px solid #f4d2aa;
      border-top-color: #ff9e36;
      border-radius: 50%;
      animation: spin 850ms linear infinite;
    }

    .success-check {
      border-radius: 50%;
      background: #33c465;
    }

    .success-check::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 7px;
      width: 15px;
      height: 8px;
      border-left: 4px solid #fff;
      border-bottom: 4px solid #fff;
      border-radius: 1px;
      transform: rotate(-45deg);
    }

    .wifi-confirm {
      position: absolute;
      top: 646px;
      left: 0;
      width: 440px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      line-height: normal;
      opacity: 0;
      transform: translateX(40px);
      transition: transform 960ms cubic-bezier(.2, .8, .2, 1), opacity 720ms ease;
    }

    .wifi-confirm.is-active {
      display: flex;
      opacity: 1;
      transform: translateX(0);
    }

    .wifi-name {
      color: #d38c7c;
    }

    .receive-preview {
      position: absolute;
      top: 608px;
      left: 154px;
      width: 132px;
      height: 220px;
      display: none;
      opacity: 0;
      transform: translateX(40px);
      transition: transform 960ms cubic-bezier(.2, .8, .2, 1), opacity 720ms ease;
    }

    .receive-preview.is-active {
      display: block;
      opacity: 1;
      transform: translateX(0);
    }

    .receive-preview img {
      display: block;
      width: 132px;
      height: 220px;
      object-fit: cover;
    }

    .success-content {
      position: absolute;
      inset: 0;
      display: none;
      opacity: 0;
      transition: opacity 520ms ease;
    }

    .connect-layer.is-success .success-content {
      display: block;
      opacity: 1;
    }

    .success-device-shell {
      position: absolute;
      top: 477px;
      left: 151px;
      width: 137.19px;
      height: 211.76px;
      overflow: hidden;
    }

    .success-device-shell img {
      position: absolute;
      top: 0;
      left: -156.9px;
      width: 309.14px;
      height: 211.76px;
      max-width: none;
    }

    .success-device-cover {
      position: absolute;
      top: 484.71px;
      left: 156.4px;
      width: 130.25px;
      height: 173.67px;
      overflow: hidden;
      -webkit-mask-image: url("assets/figma-iphone16-connect/mask.svg");
      mask-image: url("assets/figma-iphone16-connect/mask.svg");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 93.26px 158.77px;
      mask-size: 93.26px 158.77px;
      -webkit-mask-position: 16.96px 14.64px;
      mask-position: 16.96px 14.64px;
    }

    .success-device-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .success-copy {
      position: absolute;
      top: 695px;
      left: 132px;
      width: 177px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      font-weight: 500;
    }

    .success-title {
      margin: 0;
      width: 177px;
      color: #333;
      font-size: 22px;
      line-height: normal;
      letter-spacing: 0.2px;
    }

    .connect-motion {
      position: absolute;
      top: 754px;
      left: 184px;
      width: 90px;
      height: 90px;
      display: none;
      animation: connectingSpin 1100ms linear infinite;
      transform-origin: center;
    }

    .connect-motion.is-active {
      display: block;
    }

    .connect-motion img {
      display: block;
      width: 90px;
      height: 90px;
    }

    .connect-motion-dot {
      position: absolute;
      left: 39.6px;
      bottom: 0;
      width: 10.5px;
      height: 10.5px;
    }

    @keyframes connectingSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .success-device-name {
      margin: 0;
      width: 177px;
      color: #cf643d;
      font-size: 17px;
      line-height: normal;
      letter-spacing: 0.2px;
    }

    .connect-layer.is-success .sheet-title,
    .connect-layer.is-success .sheet-card,
    .connect-layer.is-success .wifi-confirm,
    .connect-layer.is-success .receive-preview {
      display: none;
    }

    .sheet-primary {
      position: absolute;
      left: 17px;
      bottom: 53px;
      width: 408px;
      height: 56px;
      border: 0;
      border-radius: 18px;
      background: #000;
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 500;
      line-height: normal;
      text-align: center;
    }

    .sheet-primary.is-disabled {
      background: #adadad;
      color: #fff;
      cursor: default;
    }

    .sheet-home-indicator {
      position: absolute;
      left: 153px;
      bottom: 5.5px;
      width: 134px;
      height: 5px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    button {
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, background-color 120ms ease, box-shadow 120ms ease;
      transform-origin: center;
    }

    button.is-pressed {
      filter: brightness(.94);
      transform: scale(.97);
    }

    .sheet-primary.is-pressed {
      filter: brightness(1.18);
      transform: scale(.985);
    }

    .scrim.is-pressed {
      filter: none;
      transform: none;
    }

    @media (min-width: 441px) {
      body {
        background: #ececec;
      }

      .phone {
        box-shadow: 0 18px 60px rgb(0 0 0 / 12%);
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="连接设备移动端原型">
    <section class="screen">
      <div class="status-bar" aria-hidden="true">
        <div class="time">9:41</div>
        <img class="cell" src="assets/figma-iphone16-connect/cell.svg" alt="">
        <img class="wifi" src="assets/figma-iphone16-connect/wifi.svg" alt="">
        <div class="battery">
          <div class="battery-body"></div>
          <div class="battery-power"></div>
          <img class="battery-head" src="assets/figma-iphone16-connect/battery-head.svg" alt="">
        </div>
      </div>

      <img class="hero-bg" src="assets/figma-iphone16-connect/bg.svg" alt="">

      <div class="device-shell" aria-hidden="true">
        <img src="assets/figma-iphone16-connect/image2.png" alt="">
      </div>
      <div class="device-cover" aria-hidden="true">
        <img src="assets/figma-iphone16-connect/image90.png" alt="">
      </div>

      <div class="device-copy">
        <h1 class="device-name">DarwinesOnyxeaed epaper...</h1>
        <p class="device-model">Boox Tile</p>
      </div>

      <button class="connection-state" type="button" id="openConnectSheet" aria-haspopup="dialog" aria-controls="connectSheet">
        <img class="connection-dot" src="assets/figma-iphone16-connect/ellipse24.svg" alt="">
        <span class="connection-text">未连接</span>
      </button>

      <button class="device-switch" aria-label="切换设备">
        <img src="assets/figma-iphone16-connect/chevron.svg" alt="">
      </button>

      <div class="action-list">
        <button class="action-card" type="button">
          <span class="action-label">导入图书</span>
          <span class="action-icon">
            <img src="assets/figma-iphone16-connect/import-book.svg" alt="">
          </span>
        </button>
        <button class="action-card" type="button">
          <span class="action-label">导入壁纸</span>
          <span class="action-icon">
            <img src="assets/figma-iphone16-connect/import-wallpaper.svg" alt="">
          </span>
        </button>
        <button class="action-card" type="button">
          <span class="action-label">网页链接</span>
          <span class="action-icon" aria-hidden="true">
            <span class="link-frame">
              <img src="assets/figma-iphone16-connect/link-inner.svg" alt="">
            </span>
          </span>
        </button>
        <button class="action-card" type="button">
          <span class="action-label">导入字体</span>
          <span class="action-icon" aria-hidden="true">
            <img class="font-main" src="assets/figma-iphone16-connect/font-main.svg" alt="">
            <img class="font-plus" src="assets/figma-iphone16-connect/font-plus.svg" alt="">
          </span>
        </button>
      </div>

      <nav class="tabbar" aria-label="底部导航">
        <div class="tab-items">
          <div class="tab" aria-current="page">
            <span class="tab-icon"><img src="assets/figma-iphone16-connect/tab-home.svg" alt=""></span>
            <span>主页</span>
          </div>
          <div class="tab">
            <span class="tab-icon tab-store"><img src="assets/figma-iphone16-connect/tab-store.svg" alt=""></span>
            <span>书城</span>
          </div>
          <div class="tab">
            <span class="tab-icon"><img src="assets/figma-iphone16-connect/tab-wallpaper.svg" alt=""></span>
            <span>壁纸</span>
          </div>
          <div class="tab">
            <span class="tab-icon tab-apps"><img src="assets/figma-iphone16-connect/tab-apps.svg" alt=""></span>
            <span>应用</span>
          </div>
          <div class="tab">
            <span class="tab-icon">
              <img class="settings-poly" src="assets/figma-iphone16-connect/tab-settings-poly.svg" alt="">
              <img class="settings-dot" src="assets/figma-iphone16-connect/tab-settings-dot.svg" alt="">
            </span>
            <span>设置</span>
          </div>
        </div>
        <img class="home-indicator" src="assets/figma-iphone16-connect/home-indicator.svg" alt="">
      </nav>

      <div class="connect-layer" id="connectSheet" role="dialog" aria-modal="true" aria-labelledby="connectSheetTitle" aria-hidden="true">
        <button class="scrim" type="button" id="closeConnectSheetByScrim" aria-label="关闭连接面板"></button>
        <div class="connect-sheet">
          <button class="sheet-close" type="button" id="closeConnectSheet" aria-label="关闭">
            <img src="assets/figma-iphone16-connect/sheet-close.svg" alt="">
          </button>
        </div>
        <h2 class="sheet-title" id="connectSheetTitle">连接 Picco</h2>
        <div class="sheet-card">
          <div class="sheet-step is-active" data-step="initial">
            <div class="sheet-card-row">
              <span class="alert-mark" aria-hidden="true">
                <img src="assets/figma-iphone16-connect/sheet-alert-circle.svg" alt="">
                <span>!</span>
              </span>
              <span class="sheet-card-text">请先连接手机 Wi‑Fi</span>
            </div>
            <span class="sheet-status-icon is-hidden" id="wifiStatusIcon" aria-hidden="true"></span>
          </div>
          <div class="sheet-step" data-step="wifi">
            <div class="sheet-card-row">
              <span class="alert-mark" aria-hidden="true">
                <img src="assets/figma-iphone16-connect/sheet-alert-circle.svg" alt="">
                <span>!</span>
              </span>
              <span class="sheet-card-text">请确认 Picco 和手机连接同个 Wi‑Fi</span>
            </div>
          </div>
          <div class="sheet-step" data-step="receive">
            <div class="sheet-card-row">
              <span class="alert-mark" aria-hidden="true">
                <img src="assets/figma-iphone16-connect/sheet-alert-circle.svg" alt="">
                <span>!</span>
              </span>
              <span class="sheet-card-text">请在 Picco 上打开「接收文件」界面</span>
            </div>
          </div>
        </div>
        <div class="wifi-confirm" id="wifiConfirm">
          <span>当前 Wi‑Fi：</span>
          <span class="wifi-name">StarNotePro</span>
        </div>
        <div class="receive-preview" id="receivePreview">
          <img src="assets/figma-iphone16-connect/receive-screen.png" alt="Picco 接收文件界面示意">
        </div>
        <div class="success-content" id="successContent">
          <div class="success-device-shell" aria-hidden="true">
            <img src="assets/figma-iphone16-connect/image2.png" alt="">
          </div>
          <div class="success-device-cover" aria-hidden="true">
            <img src="assets/figma-iphone16-connect/image90.png" alt="">
          </div>
          <div class="success-copy">
            <p class="success-title" id="successTitle">连接成功</p>
            <p class="success-device-name" id="successDeviceName">Darwin's Onyx epaper</p>
          </div>
          <div class="connect-motion" id="connectMotion" aria-hidden="true">
            <img src="assets/figma-iphone16-connect/connecting-ring.png" alt="">
            <img class="connect-motion-dot" src="assets/figma-iphone16-connect/connecting-dot.svg" alt="">
          </div>
        </div>
        <button class="sheet-primary" type="button" id="sheetPrimary">已连接，重新检测</button>
        <img class="sheet-home-indicator" src="assets/figma-iphone16-connect/home-indicator.svg" alt="">
      </div>
    </section>
  </main>

  <script>
    const phone = document.querySelector(".phone");
    const connectSheet = document.querySelector("#connectSheet");
    const openConnectSheet = document.querySelector("#openConnectSheet");
    const closeConnectSheet = document.querySelector("#closeConnectSheet");
    const closeConnectSheetByScrim = document.querySelector("#closeConnectSheetByScrim");
    const sheetPrimary = document.querySelector("#sheetPrimary");
    const wifiConfirm = document.querySelector("#wifiConfirm");
    const wifiStatusIcon = document.querySelector("#wifiStatusIcon");
    const receivePreview = document.querySelector("#receivePreview");
    const successTitle = document.querySelector("#successTitle");
    const successDeviceName = document.querySelector("#successDeviceName");
    const connectMotion = document.querySelector("#connectMotion");
    const steps = [...document.querySelectorAll(".sheet-step")];
    const pressables = [...document.querySelectorAll("button")];
    const timers = new Set();
    const pressTimers = new WeakMap();

    function queue(callback, delay) {
      const timer = window.setTimeout(() => {
        timers.delete(timer);
        callback();
      }, delay);
      timers.add(timer);
      return timer;
    }

    function clearQueuedWork() {
      for (const timer of timers) {
        window.clearTimeout(timer);
      }
      timers.clear();
    }

    function setStep(name, options = {}) {
      const active = steps.find((step) => step.classList.contains("is-active"));
      const next = steps.find((step) => step.dataset.step === name);

      if (!next || active === next) return;

      steps.forEach((step) => {
        if (step !== active && step !== next) {
          step.classList.remove("is-active", "is-exiting");
        }
      });

      if (active && options.slideLeft) {
        active.classList.add("is-exiting");
      } else if (active) {
        active.classList.remove("is-active", "is-exiting");
      }

      if (options.instant) {
        next.style.transition = "none";
        next.style.transform = "translateX(0)";
        next.style.opacity = "1";
        next.classList.remove("is-exiting");
        next.classList.add("is-active");
        next.offsetHeight;
        next.style.transition = "";
        next.style.transform = "";
        next.style.opacity = "";
      } else {
        next.classList.remove("is-exiting");
        next.classList.add("is-active");
      }

      if (active && options.slideLeft) {
        queue(() => active.classList.remove("is-active", "is-exiting"), 1040);
      }
    }

    function resetSheetFlow() {
      clearQueuedWork();
      steps.forEach((step) => step.classList.remove("is-active", "is-exiting"));
      steps.find((step) => step.dataset.step === "initial").classList.add("is-active");
      connectSheet.classList.remove("is-success");
      wifiStatusIcon.className = "sheet-status-icon is-hidden";
      wifiConfirm.classList.remove("is-active");
      receivePreview.classList.remove("is-active");
      successTitle.textContent = "连接成功";
      successDeviceName.textContent = "Darwin's Onyx epaper";
      successDeviceName.style.display = "";
      connectMotion.classList.remove("is-active");
      sheetPrimary.classList.remove("is-disabled");
      sheetPrimary.disabled = false;
      sheetPrimary.textContent = "已连接，重新检测";
    }

    function runDetectionFlow() {
      clearQueuedWork();
      wifiConfirm.classList.remove("is-active");
      receivePreview.classList.remove("is-active");
      sheetPrimary.classList.add("is-disabled");
      sheetPrimary.disabled = true;
      sheetPrimary.textContent = "检测中";
      setStep("initial", { instant: true });
      wifiStatusIcon.className = "sheet-status-icon loading-ring";

      queue(() => {
        wifiStatusIcon.className = "sheet-status-icon success-check";
      }, 2000);

      queue(() => {
        setStep("wifi", { slideLeft: true });
        wifiConfirm.classList.add("is-active");
      }, 2850);

      queue(() => {
        sheetPrimary.classList.remove("is-disabled");
        sheetPrimary.disabled = false;
        sheetPrimary.textContent = "已确认，下一步";
      }, 3950);
    }

    function goToReceiveStep() {
      clearQueuedWork();
      sheetPrimary.classList.add("is-disabled");
      sheetPrimary.disabled = true;
      wifiConfirm.classList.remove("is-active");
      setStep("receive", { slideLeft: true });

      queue(() => {
        receivePreview.classList.add("is-active");
      }, 240);

      queue(() => {
        sheetPrimary.classList.remove("is-disabled");
        sheetPrimary.disabled = false;
        sheetPrimary.textContent = "进行连接";
      }, 1040);
    }

    function handlePrimaryAction() {
      if (sheetPrimary.textContent.trim() === "已确认，下一步") {
        goToReceiveStep();
        return;
      }

      if (sheetPrimary.textContent.trim() === "进行连接") {
        goToSuccessStep();
        return;
      }

      runDetectionFlow();
    }

    function goToSuccessStep() {
      clearQueuedWork();
      receivePreview.classList.remove("is-active");
      connectSheet.classList.add("is-success");
      successTitle.textContent = "正在连接...";
      successDeviceName.style.display = "none";
      connectMotion.classList.add("is-active");
      sheetPrimary.classList.add("is-disabled");
      sheetPrimary.disabled = true;
      sheetPrimary.textContent = "连接中";

      queue(() => {
        successTitle.textContent = "连接成功";
        successDeviceName.style.display = "";
        connectMotion.classList.remove("is-active");
        sheetPrimary.classList.remove("is-disabled");
        sheetPrimary.disabled = false;
        sheetPrimary.textContent = "导入图书";
      }, 2000);
    }

    function setConnectSheetOpen(isOpen) {
      connectSheet.classList.toggle("is-open", isOpen);
      connectSheet.setAttribute("aria-hidden", String(!isOpen));
      openConnectSheet.classList.toggle("is-selected", isOpen);

      if (!isOpen) {
        resetSheetFlow();
      }
    }

    function syncScale() {
      const width = phone.getBoundingClientRect().width;
      document.documentElement.style.setProperty("--scale", String(width / 440));
    }

    openConnectSheet.addEventListener("click", () => setConnectSheetOpen(true));
    closeConnectSheet.addEventListener("click", () => setConnectSheetOpen(false));
    closeConnectSheetByScrim.addEventListener("click", () => setConnectSheetOpen(false));
    sheetPrimary.addEventListener("click", handlePrimaryAction);
    pressables.forEach((button) => {
      button.addEventListener("pointerdown", () => {
        if (button.disabled) return;
        window.clearTimeout(pressTimers.get(button));
        button.classList.add("is-pressed");
      });
      button.addEventListener("pointerup", () => {
        const timer = window.setTimeout(() => button.classList.remove("is-pressed"), 180);
        pressTimers.set(button, timer);
      });
      button.addEventListener("pointerleave", () => {
        const timer = window.setTimeout(() => button.classList.remove("is-pressed"), 120);
        pressTimers.set(button, timer);
      });
      button.addEventListener("click", () => {
        if (button.disabled) return;
        window.clearTimeout(pressTimers.get(button));
        button.classList.add("is-pressed");
        const timer = window.setTimeout(() => button.classList.remove("is-pressed"), 180);
        pressTimers.set(button, timer);
      });
    });
    window.addEventListener("resize", syncScale);
    syncScale();
  </script>
</body>
</html>
